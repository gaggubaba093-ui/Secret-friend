<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Secret Frame</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
font-family:Arial,sans-serif;background:#06121b;color:#fff
}
button,input{font:inherit}
button{cursor:pointer}

#login{
height:100dvh;display:flex;align-items:center;justify-content:center;
padding:20px;background:#020b12
}
.loginBox{
width:min(410px,100%);padding:28px 22px;border:1px solid #08c8ff;
border-radius:25px;background:#071824;box-shadow:0 0 35px #008cff44
}
.logo{
width:100px;height:100px;margin:auto;border:4px solid #08c8ff;
border-radius:50%;display:grid;place-items:center;font-size:40px;
font-weight:900;font-style:italic;box-shadow:0 0 25px #00bfff
}
h1{text-align:center;margin:16px 0 5px}
.sub{text-align:center;color:#91aabd;margin-bottom:22px}
.loginBox input{
width:100%;height:52px;margin-bottom:12px;padding:0 15px;
border-radius:13px;border:1px solid #174c6c;background:#06131d;
color:#fff;outline:0
}
.loginBtn{
width:100%;height:52px;border:0;border-radius:13px;
background:linear-gradient(135deg,#08cfff,#00d19d);
color:#fff;font-weight:bold
}
.loginBtn:disabled{opacity:.6}
.error{text-align:center;color:#ff6878;min-height:25px;margin-top:10px}
.hint{text-align:center;color:#91aabd;font-size:12px;line-height:1.5}

#app{display:none;width:100%;height:100dvh}
.chats{height:100%;background:#071923;display:flex;flex-direction:column}
.top{
height:78px;display:flex;align-items:center;padding:10px 13px;
border-bottom:1px solid #104965
}
.topLogo{
width:50px;height:50px;border:3px solid #08c8ff;border-radius:50%;
display:grid;place-items:center;font-weight:900;font-style:italic
}
.topTitle{flex:1;padding-left:12px}
.topTitle b{display:block;font-size:20px}
.topTitle span{color:#91aabd;font-size:12px}
.menu{
width:44px;height:44px;border:1px solid #12618e;border-radius:11px;
background:#0b2637;color:#fff;font-size:23px
}
.search{padding:9px;border-bottom:1px solid #10394e}
.search input{
width:100%;height:45px;border:1px solid #174c6c;border-radius:23px;
background:#06131d;color:#fff;padding:0 16px;outline:0
}
.list{flex:1;overflow:auto}
.person{
height:80px;display:flex;align-items:center;gap:12px;
padding:10px 13px;border-bottom:1px solid #0d3347
}
.person:active{background:#0d2c3d}
.avatar{
width:57px;height:57px;flex:none;border:2px solid #08c8ff;
border-radius:50%;display:grid;place-items:center;
background:#0b2232;font-weight:bold
}
.info{flex:1;min-width:0}
.name{font-weight:bold}
.status{
font-size:12px;color:#91aabd;margin-top:6px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.dot{
display:inline-block;width:8px;height:8px;border-radius:50%;
background:#00e85a;margin-left:5px
}

.chat{
position:fixed;inset:0;background:#06121b;display:none;
flex-direction:column;z-index:20
}
.chatHeader{
height:78px;flex:none;display:flex;align-items:center;gap:8px;
padding:8px;border-bottom:1px solid #0876b7;background:#071923
}
.back{
width:42px;height:42px;border:0;background:transparent;
color:#fff;font-size:30px
}
.chatAv{
width:49px;height:49px;border:2px solid #08c8ff;
border-radius:50%;display:grid;place-items:center;font-weight:bold
}
.chatTitle{flex:1;min-width:0}
.chatTitle b{display:block;font-size:17px}
.chatTitle span{display:block;color:#91aabd;font-size:11px;margin-top:4px}
.callBtn{
width:44px;height:44px;border:1px solid #12618e;
border-radius:11px;background:#0b2637;color:#fff;font-size:20px
}
.video{background:#00a987}

.messages{
flex:1;overflow:auto;padding:13px 10px;display:flex;
flex-direction:column;gap:8px
}
.msg{
max-width:82%;padding:10px 13px;background:#162b40;
border-radius:16px;align-self:flex-start
}
.msg.mine{align-self:flex-end;background:#007c69}
.msgText{font-size:16px;word-break:break-word}
.msgTime{text-align:right;font-size:9px;color:#b8c8cf;margin-top:4px}

.compose{
height:68px;flex:none;display:flex;gap:7px;padding:8px;
background:#071923;border-top:1px solid #104965
}
.compose input{
flex:1;min-width:0;border:1px solid #174c6c;border-radius:25px;
background:#06131d;color:#fff;padding:0 15px;outline:0
}
.send{
width:49px;height:49px;border:0;border-radius:50%;
background:linear-gradient(135deg,#08cfff,#00d19d);
color:#fff;font-size:21px
}

/* CALL */
.call{
display:none;position:fixed;z-index:100;inset:0;background:#000d;
align-items:center;justify-content:center;padding:12px
}
.callBox{
width:min(700px,100%);background:#071722;
border:1px solid #08c8ff;border-radius:20px;padding:15px
}
.callHead{display:flex;justify-content:space-between;align-items:center}
.close{
width:40px;height:40px;border:1px solid #31556b;
border-radius:10px;background:#142936;color:#fff
}
.videos{
display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px
}
.videoBox{
background:#000;border-radius:13px;overflow:hidden;min-height:220px
}
.videoBox video{
width:100%;height:100%;min-height:220px;object-fit:cover
}
.controls{
display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap
}
.control{
border:0;border-radius:11px;padding:12px 17px;
background:#123248;color:#fff
}
.end{background:#d63b4e}
.accept{background:#00a884}
.incoming{text-align:center;padding:25px}

@media(max-width:600px){
.videos{grid-template-columns:1fr}
.videoBox,.videoBox video{min-height:180px}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="login">
<div class="loginBox">

<h1>Secret Frame</h1>

id="loginId"

inputmode="numeric"

<div id="app">

<div class="chats">

<div class="top">

<div class="topLogo">SF</div>

</div>

</div>
</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

apiKey:
"AIzaSyB7B00ndag8PE78pjLxFg4iok9-9_U5bz0",

authDomain:
"secret-frame-698ba.firebaseapp.com",

databaseURL:
"https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"secret-frame-698ba",

storageBucket:
"secret-frame-698ba.firebasestorage.app",

messagingSenderId:
"601470862803",

appId:
"1:601470862803:web:3b666e06133804609b9b26"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =====================================================
   TEST MEMBERS
   चारों नंबर
===================================================== */

const TEST_MEMBERS = {

"9771094346":{
name:"Member 1",
phone:"9771094346",
password:"1234",
role:"member"
},

"7209000233":{
name:"Member 2",
phone:"7209000233",
password:"1234",
role:"member"
},

"9939960113":{
name:"Member 3",
phone:"9939960113",
password:"1234",
role:"member"
},

"7337753903":{
name:"Member 4",
phone:"7337753903",
password:"1234",
role:"member"
}

};


/* =====================================================
   CURRENT USER
===================================================== */

let me =
localStorage.getItem("sfPhone") || "";

let myName =
localStorage.getItem("sfName") || "";

let selected = null;

let messageListener = null;

let membersListener = null;


/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(value){

return String(value || "")
.replace(/\D/g,"")
.slice(-10");

}


/* =====================================================
   MEMBER PHONE
===================================================== */

function memberPhone(member,key){

return normalizePhone(
member?.phone || key || ""
);

}


/* =====================================================
   MEMBER NAME
===================================================== */

function memberName(member,key){

return String(
member?.name ||
member?.displayName ||
("Member " + memberPhone(member,key))
).trim();

}


/* =====================================================
   FIND MEMBER
   Firebase key और phone दोनों check
===================================================== */

async function fetchMember(phone){

const wanted =
normalizePhone(phone);

return new Promise(resolve=>{

onValue(

ref(db,"members"),

snapshot=>{

const data =
snapshot.val() || {};

let found = null;


Object.entries(data).forEach(
([key,member])=>{

if(
!member ||
typeof member !== "object"
)return;

const keyPhone =
normalizePhone(key);

const storedPhone =
normalizePhone(member.phone);


/* Firebase key या phone field */

if(
keyPhone === wanted ||
storedPhone === wanted
){

found = {

...member,

phone:
storedPhone || keyPhone,

memberKey:key

};

}

});


/*
अगर Firebase में अभी record नहीं है,
तो चार test members भी काम करेंगे।
*/

if(!found && TEST_MEMBERS[wanted]){

found = TEST_MEMBERS[wanted];

}


resolve(found);

},

error=>{

console.error(error);

resolve(
TEST_MEMBERS[wanted] || null
);

},

{onlyOnce:true}

);

});

}


/* =====================================================
   LOGIN
===================================================== */

window.login = async function(){

const phone =
normalizePhone(
document.getElementById("loginId").value
);

const password =
document.getElementById("loginPassword")
.value.trim();

const error =
document.getElementById("error");

const button =
document.getElementById("loginButton");

error.textContent = "";


if(phone.length !== 10){

error.textContent =
"सही 10 अंकों का Mobile Number डालें।";

return;

}


if(!password){

error.textContent =
"Password डालें।";

return;

}


button.disabled = true;

button.textContent = "Checking...";


try{

const member =
await fetchMember(phone);


if(!member){

error.textContent =
"यह Mobile Number registered नहीं है।";

return;

}


/*
Firebase password हो तो वही।
Test member के लिए 1234।
*/

const savedPassword =
String(
member.password || "1234"
).trim();


if(savedPassword !== password){

error.textContent =
"Password गलत है।";

return;

}


me =
normalizePhone(
member.phone || phone
);

myName =
memberName(
member,
me
);


localStorage.setItem(
"sfPhone",
me
);

localStorage.setItem(
"sfName",
myName
);


openApp();


}catch(e){

console.error(e);

error.textContent =
"Firebase connection problem।";

}finally{

button.disabled = false;

button.textContent = "Login";

}

};


/* =====================================================
   OPEN APP
===================================================== */

function openApp(){

document.getElementById("login")
.style.display = "none";

document.getElementById("app")
.style.display = "block";

loadMembers();

listenIncomingCalls();

}


/* =====================================================
   LOAD MEMBERS
===================================================== */

function loadMembers(){

if(membersListener){

membersListener();

membersListener = null;

}


membersListener =

onValue(

ref(db,"members"),

snapshot=>{

const firebaseMembers =
snapshot.val() || {};

const merged = {
...TEST_MEMBERS
};


/* Firebase members */

Object.entries(firebaseMembers)
.forEach(
([key,member])=>{

if(
!member ||
typeof member !== "object"
)return;

const phone =
memberPhone(member,key);

if(!phone)return;


merged[phone] = {

...member,

phone:phone

};

});


renderMembers(
Object.values(merged)
);

}

);

}


/* =====================================================
   RENDER MEMBERS
===================================================== */

function renderMembers(members){

const box =
document.getElementById("people");

box.innerHTML = "";


members.forEach(member=>{

const phone =
normalizePhone(member.phone);

if(!phone)return;

if(phone === me)return;


const name =
member.name ||
("Member " + phone.slice(-4));


const row =
document.createElement("div");

row.className = "person";

row.dataset.name =
name.toLowerCase();

row.dataset.phone =
phone;


row.innerHTML = `

<div class="avatar">
${name.substring(0,2).toUpperCase()}
</div>

<div class="info">

<div class="name"></div>

<div
class="status"
id="last-${safe(phone)}"
>
Start a private chat
</div>

</div>

`;


row.querySelector(".name")
.textContent = name;


row.onclick = () => {

openChat({

...member,

name:name,

phone:phone

});

};


box.appendChild(row);


listenLastMessage({

...member,

name:name,

phone:phone

});

});

}


/* =====================================================
   LAST MESSAGE
===================================================== */

function listenLastMessage(member){

const id =
chatId(
me,
member.phone
);


onValue(

ref(
db,
"privateChats/" +
id +
"/messages"
),

snapshot=>{

const data =
snapshot.val();

if(!data)return;


const arr =
Object.values(data);

if(!arr.length)return;


arr.sort(
(a,b)=>
(a.createdAt || 0) -
(b.createdAt || 0)
);


const last =
arr[arr.length - 1];


const box =
document.getElementById(
"last-" +
safe(member.phone)
);


if(box){

box.textContent =
last.sender === me
?
"You: " + last.text
:
last.text;

}

}

);

}


/* =====================================================
   OPEN CHAT
===================================================== */

window.openChat = function(member){

selected = member;


document.getElementById(
"chatName"
).textContent =
member.name;


document.getElementById(
"chatAvatar"
).textContent =
member.name
.substring(0,2)
.toUpperCase();


document.getElementById(
"chat"
).style.display =
"flex";


loadMessages();

};


/* =====================================================
   CHAT ID
===================================================== */

function chatId(a,b){

return [

normalizePhone(a),

normalizePhone(b)

]

.sort()

.join("_");

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

const box =
document.getElementById("messages");

box.innerHTML = "";


if(messageListener){

messageListener();

messageListener = null;

}


if(!selected)return;


const id =
chatId(
me,
selected.phone
);


messageListener =

onChildAdded(

ref(
db,
"privateChats/" +
id +
"/messages"
),

snap=>{

const data =
snap.val();

if(!data)return;


const msg =
document.createElement("div");

msg.className =
"msg " +
(
data.sender === me
?
"mine"
:
""
);


const text =
document.createElement("div");

text.className =
"msgText";

text.textContent =
data.text || "";


const timeBox =
document.createElement("div");

timeBox.className =
"msgTime";

timeBox.textContent =
time(data.createdAt) +
(
data.sender === me
?
" ✓✓"
:
""
);


msg.appendChild(text);

msg.appendChild(timeBox);

box.appendChild(msg);


box.scrollTop =
box.scrollHeight;

}

);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

window.sendMessage =
async function(e){

e.preventDefault();


if(!selected)return;


const input =
document.getElementById("message");

const text =
input.value.trim();


if(!text)return;


const id =
chatId(
me,
selected.phone
);


try{

await push(

ref(
db,
"privateChats/" +
id +
"/messages"
),

{

sender:me,

senderName:myName,

receiver:selected.phone,

text:text,

createdAt:Date.now()

}

);


input.value = "";


}catch(e){

console.error(e);

alert(
"Message send नहीं हुआ।"
);

}

};


/* =====================================================
   SEARCH
===================================================== */

window.searchPeople =
function(){

const q =
document.getElementById("search")
.value
.toLowerCase()
.trim();


document
.querySelectorAll(".person")
.forEach(row=>{

row.style.display =
row.dataset.name.includes(q)
?
"flex"
:
"none";

});

};


/* =====================================================
   CLOSE CHAT
===================================================== */

window.closeChat =
function(){

if(messageListener){

messageListener();

messageListener = null;

}


document.getElementById(
"chat"
).style.display =
"none";


selected = null;

};


/* =====================================================
   LOGOUT
===================================================== */

window.logout =
function(){

localStorage.removeItem("sfPhone");

localStorage.removeItem("sfName");

location.reload();

};


/* =====================================================
   HELPERS
===================================================== */

function safe(x){

return normalizePhone(x);

}


function time(t){

return new Date(
t || Date.now()
).toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =====================================================
   WEBRTC CALL
===================================================== */

let pc = null;

let stream = null;

let callId = null;

let callType = "audio";

let incoming = null;


const rtcConfig = {

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

};


/* =====================================================
   START CALL
===================================================== */

window.startCall =
async function(type){

if(!selected){

alert(
"पहले दोस्त की chat खोलें।"
);

return;

}


callType = type;


callId =
"call_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.slice(2);


try{

stream =
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:
type === "video"

});


pc =
new RTCPeerConnection(
rtcConfig
);


stream
.getTracks()
.forEach(
track =>
pc.addTrack(
track,
stream
)
);


pc.ontrack = e => {

document.getElementById(
"remoteVideo"
).srcObject =
e.streams[0];

};


pc.onicecandidate = e => {

if(!e.candidate)return;


set(

ref(
db,
"calls/" +
callId +
"/callerCandidates/" +
Date.now()
),

e.candidate.toJSON()

);

};


const offer =
await pc.createOffer();


await pc.setLocalDescription(
offer
);


await set(

ref(
db,
"calls/" +
callId
),

{

caller:me,

callerName:myName,

callee:selected.phone,

calleeName:selected.name,

type:type,

status:"ringing",

offer:{
type:offer.type,
sdp:offer.sdp
},

createdAt:Date.now()

}

);


showActive(
"Calling " +
selected.name
);


onValue(

ref(
db,
"calls/" +
callId +
"/answer"
),

async snap=>{

const answer =
snap.val();


if(
answer &&
pc &&
!pc.currentRemoteDescription
){

await pc.setRemoteDescription(
new RTCSessionDescription(answer)
);


showActive(
"Connected"
);

}

}

);


onChildAdded(

ref(
db,
"calls/" +
callId +
"/calleeCandidates"
),

async snap=>{

if(!pc)return;


try{

await pc.addIceCandidate(
new RTCIceCandidate(
snap.val()
)
);

}catch(e){}

}

);


}catch(e){

console.error(e);

alert(
"Camera/Microphone permission Allow करें.\n\n" +
e.message
);

cleanup();

}

};


/* =====================================================
   INCOMING CALL
===================================================== */

function listenIncomingCalls(){

onValue(

ref(db,"calls"),

snapshot=>{

const calls =
snapshot.val() || {};


for(
const id in calls
){

const c =
calls[id];


if(

c &&
c.callee === me &&
c.status === "ringing" &&
!callId

){

incoming = {

id:id,

data:c

};


callId = id;

callType = c.type;


document.getElementById(
"call"
).style.display =
"flex";


document.getElementById(
"incoming"
).style.display =
"block";


document.getElementById(
"activeCall"
).style.display =
"none";


document.getElementById(
"callTitle"
).textContent =
"Incoming Call";


document.getElementById(
"incomingName"
).textContent =
c.callerName ||
"Friend";


document.getElementById(
"incomingType"
).textContent =
c.type === "video"
?
"📹 Video Call"
:
"📞 Voice Call";


break;

}

}

}

);

}


/* =====================================================
   ACCEPT CALL
===================================================== */

window.acceptCall =
async function(){

if(!incoming)return;


const c =
incoming.data;


try{

stream =
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:
c.type === "video"

});


pc =
new RTCPeerConnection(
rtcConfig
);


stream
.getTracks()
.forEach(
track =>
pc.addTrack(
track,
stream
)
);


pc.ontrack = e => {

document.getElementById(
"remoteVideo"
).srcObject =
e.streams[0];

};


pc.onicecandidate = e => {

if(!e.candidate)return;


set(

ref(
db,
"calls/" +
callId +
"/calleeCandidates/" +
Date.now()
),

e.candidate.toJSON()

);

};


await pc.setRemoteDescription(

new RTCSessionDescription(
c.offer
)

);


const answer =
await pc.createAnswer();


await pc.setLocalDescription(
answer
);


await set(

ref(
db,
"calls/" +
callId +
"/answer"
),

{

type:answer.type,

sdp:answer.sdp

}

);


await set(

ref(
db,
"calls/" +
callId +
"/status"
),

"connected"

);


showActive("Connected");


onChildAdded(

ref(
db,
"calls/" +
callId +
"/callerCandidates"
),

async snap=>{

try{

await pc.addIceCandidate(

new RTCIceCandidate(
snap.val()
)

);

}catch(e){}

}

);


}catch(e){

console.error(e);

alert(
"Call accept नहीं हुई:\n" +
e.message
);

cleanup();

}

};


/* =====================================================
   REJECT CALL
===================================================== */

window.rejectCall =
async function(){

if(callId){

try{

await set(

ref(
db,
"calls/" +
callId +
"/status"
),

"rejected"

);

}catch(e){}

}


cleanup();

};


/* =====================================================
   CALL UI
===================================================== */

function showActive(title){

document.getElementById(
"call"
).style.display =
"flex";


document.getElementById(
"incoming"
).style.display =
"none";


document.getElementById(
"activeCall"
).style.display =
"block";


document.getElementById(
"callTitle"
).textContent =
"📞 " + title;


document.getElementById(
"localVideo"
).srcObject =
stream;


if(callType === "audio"){

document.getElementById(
"localVideo"
).style.display =
"none";


document.getElementById(
"remoteVideo"
).style.display =
"none";

}else{

document.getElementById(
"localVideo"
).style.display =
"block";


document.getElementById(
"remoteVideo"
).style.display =
"block";

}

}


/* =====================================================
   MIC
===================================================== */

window.toggleMic =
function(){

if(!stream)return;


const track =
stream.getAudioTracks()[0];


if(track){

track.enabled =
!track.enabled;

}

};


/* =====================================================
   CAMERA
===================================================== */

window.toggleCamera =
function(){

if(!stream)return;


const track =
stream.getVideoTracks()[0];


if(track){

track.enabled =
!track.enabled;

}

};


/* =====================================================
   END CALL
===================================================== */

window.endCall =
async function(){

if(callId){

try{

await set(

ref(
db,
"calls/" +
callId +
"/status"
),

"ended"

);

}catch(e){}

}


cleanup();

};


/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

if(stream){

stream
.getTracks()
.forEach(
track =>
track.stop()
);

stream = null;

}


if(pc){

pc.close();

pc = null;

}


document.getElementById(
"localVideo"
).srcObject = null;


document.getElementById(
"remoteVideo"
).srcObject = null;


document.getElementById(
"call"
).style.display =
"none";


document.getElementById(
"incoming"
).style.display =
"none";


document.getElementById(
"activeCall"
).style.display =
"none";


incoming = null;

callId = null;

}


/* =====================================================
   AUTO LOGIN
===================================================== */

if(me){

openApp();

}

</script>

</body>
</html>
