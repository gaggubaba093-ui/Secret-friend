<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Frame</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#06121b;
  color:#eef7ff;
}

.app{
  height:100dvh;
  display:flex;
  background:#06121b;
}

/* LEFT SIDEBAR */
.side{
  width:110px;
  flex:none;
  background:#091923;
  border-right:1px solid #0876b7;
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
}

.logo{
  width:74px;
  height:74px;
  border:4px solid #08c8ff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:bold;
  font-style:italic;
  box-shadow:0 0 22px #00bfff;
}

.nav{
  width:84px;
  height:72px;
  border:1px solid #12618e;
  border-radius:15px;
  background:#0a2030;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}

.grow{
  flex:1;
}

.logout{
  background:#30121a;
}

/* MEMBERS */
.members{
  width:300px;
  flex:none;
  background:#071722;
  border-right:1px solid #0876b7;
}

.mh{
  padding:22px 18px;
  border-bottom:1px solid #124d70;
  font-size:21px;
  font-weight:bold;
}

.member{
  display:flex;
  gap:13px;
  align-items:center;
  padding:15px;
  border-bottom:1px solid #12364a;
}

.av{
  width:56px;
  height:56px;
  flex:none;
  border:2px solid #08c8ff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.info{
  min-width:0;
}

.name{
  font-weight:bold;
}

.id{
  color:#91aabd;
  font-size:14px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00e85a;
  box-shadow:0 0 8px #00e85a;
}

/* CHAT */
.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.top{
  height:94px;
  flex:none;
  background:#081a27;
  border-bottom:1px solid #0876b7;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
}

.menu{
  display:none;
  width:44px;
  height:44px;
  background:#0b2637;
  color:#fff;
  border:1px solid #12618e;
  border-radius:12px;
  font-size:24px;
}

.cav{
  width:56px;
  height:56px;
  border:2px solid #08c8ff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:bold;
  flex:none;
}

.title{
  flex:1;
  min-width:0;
}

.title b{
  display:block;
  font-size:22px;
}

.title span{
  display:block;
  color:#91aabd;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:9px;
}

.act{
  width:58px;
  height:58px;
  border:1px solid #12618e;
  border-radius:14px;
  background:#0b2637;
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

.video{
  background:#00bfa0;
}

/* MESSAGES */
.msgs{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:18px 22px;
  background:#06121b;
  display:flex;
  flex-direction:column;
  gap:11px;
}

.bubble{
  max-width:72%;
  padding:11px 15px;
  border-radius:17px;
  background:#162b40;
}

.mine{
  align-self:flex-end;
  background:#007b69;
}

.sender{
  font-size:13px;
  color:#72d4ff;
  margin-bottom:5px;
}

.mine .sender{
  color:#b7fff0;
}

.text{
  font-size:17px;
  word-break:break-word;
}

.time{
  font-size:11px;
  color:#9fb1bd;
  text-align:right;
  margin-top:4px;
}

.empty{
  margin:auto;
  text-align:center;
  color:#8196a5;
}

/* MESSAGE BOX */
.compose{
  height:76px;
  flex:none;
  background:#081a27;
  border-top:1px solid #124d70;
  padding:10px;
  display:flex;
  gap:9px;
}

.compose input{
  flex:1;
  min-width:0;
  border:1px solid #174c6c;
  border-radius:28px;
  background:#061522;
  color:#fff;
  padding:0 17px;
  outline:none;
}

.send{
  width:55px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#08cfff,#00d19d);
  font-size:24px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:800px){

  .app{
    display:block;
    position:relative;
  }

  .side{
    position:absolute;
    z-index:30;
    left:0;
    top:0;
    bottom:0;
    width:82px;
    transform:translateX(-100%);
    transition:.2s;
  }

  .side.open{
    transform:translateX(0);
  }

  .members{
    position:absolute;
    z-index:20;
    left:0;
    top:0;
    bottom:0;
    width:min(88vw,310px);
    transform:translateX(-100%);
    transition:.2s;
    box-shadow:10px 0 30px #000;
  }

  .members.open{
    transform:translateX(0);
  }

  .chat{
    width:100%;
    height:100%;
  }

  .top{
    height:88px;
    padding:8px 10px;
  }

  .menu{
    display:block;
  }

  .cav{
    width:48px;
    height:48px;
  }

  .title b{
    font-size:19px;
  }

  .title span{
    font-size:13px;
  }

  .act{
    width:48px;
    height:48px;
    font-size:21px;
  }

  .msgs{
    padding:12px 10px;
  }

  .bubble{
    max-width:87%;
  }

  .compose{
    height:68px;
  }

  .send{
    width:49px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="side" id="side">

  <div class="logo">SF</div>

  <button class="nav">💬</button>

  <button class="nav" onclick="toggleMembers()">👥</button>

  <button class="nav">🖼️</button>

  <button class="nav">📞</button>

  <button class="nav">📹</button>

  <div class="grow"></div>

  <button class="nav logout" onclick="logout()">↪</button>

</aside>


<!-- MEMBERS -->
<aside class="members" id="members">

  <div class="mh">
    Members
    <span class="dot"></span>
  </div>

  <div class="member">
    <div class="av">SF</div>
    <div class="info">
      <div class="name">
        Owner / Admin
        <span class="dot"></span>
      </div>
      <div class="id">ADMIN</div>
    </div>
  </div>

  <div class="member">
    <div class="av">F1</div>
    <div class="info">
      <div class="name">
        Friend 1
        <span class="dot"></span>
      </div>
      <div class="id">7209000233</div>
    </div>
  </div>

  <div class="member">
    <div class="av">F2</div>
    <div class="info">
      <div class="name">
        Friend 2
        <span class="dot"></span>
      </div>
      <div class="id">+917337753903</div>
    </div>
  </div>

  <div class="member">
    <div class="av">F3</div>
    <div class="info">
      <div class="name">
        Friend 3
        <span class="dot"></span>
      </div>
      <div class="id">+919771094346</div>
    </div>
  </div>

</aside>


<!-- CHAT -->
<main class="chat">

<header class="top">

  <button class="menu" onclick="toggleMembers()">☰</button>

  <div class="cav">SF</div>

  <div class="title">
    <b>Secret Frame</b>
    <span>🔒 Real-time private group • 4 Members</span>
  </div>

  <div class="actions">

    <button class="act">📞</button>

    <button class="act video">📹</button>

  </div>

</header>


<section class="msgs" id="msgs">

  <div class="empty" id="empty">
    No messages yet.
    <br>
    Send a message below.
  </div>

</section>


<form class="compose" onsubmit="send(event)">

  <input
    id="input"
    placeholder="Type a message..."
    autocomplete="off"
  >

  <button class="send">
    ➤
  </button>

</form>

</main>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  query,
  orderByChild
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE CONFIG */

const app = initializeApp({

  apiKey:
  "AIzaSyB7B00ndag8PE78pjLxFg4iok9-9_U5bz0",

  authDomain:
  "secret-frame-698ba.firebaseapp.com",

  databaseURL:
  "https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "secret-frame-698ba",

  storageBucket:
  "secret-frame-698ba.firebasestorage.app",

  messagingSenderId:
  "601470862803",

  appId:
  "1:601470862803:web:3b666e06133804609b9b26"

});


const db = getDatabase(app);

const messages = ref(db,"messages");


/* CURRENT USER */

window.user =
localStorage.getItem("sfUser") ||
"Friend 1";


/* MEMBERS PANEL */

window.toggleMembers = () => {

  document
  .getElementById("members")
  .classList
  .toggle("open");

};


/* LOGOUT */

window.logout = () => {

  localStorage.removeItem("sfUser");

  location.reload();

};


/* SEND MESSAGE */

window.send = async (e) => {

  e.preventDefault();

  const input =
  document.getElementById("input");

  const text =
  input.value.trim();

  if(!text) return;

  try{

    await push(messages,{

      text:text,

      sender:window.user,

      createdAt:Date.now()

    });

    input.value="";

  }

  catch(error){

    alert(
      "Message send नहीं हुआ. Firebase Rules check करें."
    );

    console.error(error);

  }

};


/* RECEIVE MESSAGES */

onChildAdded(

  query(
    messages,
    orderByChild("createdAt")
  ),

  (snapshot) => {

    const data = snapshot.val();

    const empty =
    document.getElementById("empty");

    if(empty){
      empty.remove();
    }


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble " +
    (
      data.sender === window.user
      ? "mine"
      : ""
    );


    bubble.innerHTML = `

      <div class="sender"></div>

      <div class="text"></div>

      <div class="time"></div>

    `;


    bubble
    .querySelector(".sender")
    .textContent =
    data.sender || "Friend";


    bubble
    .querySelector(".text")
    .textContent =
    data.text || "";


    bubble
    .querySelector(".time")
    .textContent =
    new Date(
      data.createdAt || Date.now()
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


    document
    .getElementById("msgs")
    .appendChild(bubble);


    const box =
    document.getElementById("msgs");

    box.scrollTop =
    box.scrollHeight;

  }

);

</script>

</body>
</html>
