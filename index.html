<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Frame</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b141a;color:#fff}
button,input{font:inherit}button{cursor:pointer;border:0}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#075e54,#111b21);padding:20px}
.box{width:min(410px,100%);background:#17232b;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0008}
.logo{width:70px;height:70px;display:grid;place-items:center;background:#00a884;border-radius:20px;font-size:28px;font-weight:900;margin-bottom:15px}
input{width:100%;background:#111b21;color:#fff;border:1px solid #33434e;border-radius:10px;padding:13px;margin:7px 0 12px;outline:0}
.btn{padding:11px 15px;border-radius:9px;font-weight:bold}
.green{background:#00a884;color:#fff}
.gray{background:#26343d;color:#fff}
.red{background:#e5484d;color:#fff}
.app{display:none;height:100vh}
.sidebar{width:260px;background:#111b21;border-right:1px solid #26343d;display:flex;flex-direction:column}
.brand{padding:18px;font-size:21px;font-weight:bold;border-bottom:1px solid #26343d}
.members{flex:1;padding:12px;overflow:auto}
.member{background:#1c2931;padding:12px;border-radius:10px;margin:7px 0}
.dot{width:9px;height:9px;display:inline-block;border-radius:50%;background:#00c853;margin-right:7px}
.side{padding:12px;border-top:1px solid #26343d}
.side button{width:100%;margin-top:7px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:65px;background:#202c33;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.chat{flex:1;overflow:auto;padding:18px;background:#0b141a}
.msg{max-width:78%;background:#202c33;padding:10px 13px;border-radius:11px;margin:7px 0;word-break:break-word}
.mine{margin-left:auto;background:#005c4b}
.msg small{display:block;color:#9eacb6;font-size:10px;margin-bottom:4px}
.msg img,.msg video{max-width:100%;border-radius:10px;margin-top:5px}
.composer{background:#202c33;padding:12px;display:flex;gap:7px}
.composer input{flex:1;margin:0}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#17232b;border-radius:18px;padding:20px}
.video{display:grid;grid-template-columns:1fr 1fr;gap:10px}
video{width:100%;min-height:180px;background:#000;border-radius:12px}
.row{background:#202c33;padding:13px;border-radius:10px;margin:7px 0}
@media(max-width:700px){
.sidebar{width:70px}
.brand span,.member span:last-child,.side span{display:none}
.member{text-align:center}
}
</style>
</head>

<body>

<div id="login" class="login">
<div class="box">

<div class="logo">SF</div>

<h1>Secret Frame</h1>

<p style="color:#9daab3">
Private Group • 4 Members
</p>

<label>Mobile Number / Admin ID</label>
<input id="phone" placeholder="Enter number">

<label>Password</label>
<input id="password" type="password" placeholder="Enter password">

<button class="btn green" style="width:100%" onclick="login()">
Login
</button>

<p id="error" style="color:#ff7777"></p>

</div>
</div>


<div id="app" class="app">

<aside class="sidebar">

<div class="brand">
🔐 <span>Secret Frame</span>
</div>

<div class="members">

<h4>Members</h4>

<div class="member">
<span class="dot"></span>
<span>Owner / Admin</span>
</div>

<div class="member">
<span class="dot"></span>
<span>7209000233</span>
</div>

<div class="member">
<span class="dot"></span>
<span>+917337753903</span>
</div>

<div class="member">
<span class="dot"></span>
<span>+919771094346</span>
</div>

</div>

<div class="side">

<button id="adminBtn" class="btn gray" onclick="adminPanel()">
⚙️ <span>Admin</span>
</button>

<button id="inviteBtn" class="btn gray" onclick="invite()">
🔗 <span>Invite</span>
</button>

<button class="btn red" onclick="logout()">
🚪 <span>Logout</span>
</button>

</div>
</aside>


<main class="main">

<div class="top">

<div>
<b>💬 Secret Frame</b>
<div style="font-size:11px;color:#8b9aa5">
Private Group • 4 Members
</div>
</div>

<div style="display:flex;gap:6px">
<button class="btn gray" onclick="voiceCall()">📞</button>
<button class="btn green" onclick="videoCall()">📹</button>
</div>

</div>


<div id="chat" class="chat"></div>


<div class="composer">

<input
id="message"
placeholder="Write a message..."
onkeydown="enterSend(event)"
>

<button class="btn gray" onclick="pickMedia()">📷</button>

<button class="btn green" onclick="sendMessage()">Send</button>

</div>

<input
id="media"
type="file"
accept="image/*,video/*"
style="display:none"
onchange="sendMedia(event)"
>

</main>
</div>


<div id="modal" class="modal">

<div class="modalbox">

<div style="display:flex;justify-content:space-between;align-items:center">

<h3 id="modalTitle">Secret Frame</h3>

<button class="btn gray" onclick="closeModal()">✕</button>

</div>

<div id="modalContent"></div>

</div>
</div>


<script>

const ADMIN={
id:"ADMIN",
password:"admin123",
name:"Owner"
};

const MEMBERS={
"7209000233":{
name:"Friend 1",
password:"1111",
active:true
},
"+917337753903":{
name:"Friend 2",
password:"2222",
active:true
},
"+919771094346":{
name:"Friend 3",
password:"3333",
active:true
}
};

let currentUser=null;

let disabled=
JSON.parse(
localStorage.getItem("SF_disabled")||"[]"
);

let messages=
JSON.parse(
localStorage.getItem("SF_messages")||"[]"
);


/* LOGIN */

function login(){

const id=
document.getElementById("phone")
.value.trim();

const pass=
document.getElementById("password")
.value;

if(id===ADMIN.id && pass===ADMIN.password){

currentUser="ADMIN";

openApp();

return;

}

if(!MEMBERS[id] || MEMBERS[id].password!==pass){

document.getElementById("error")
.innerText="Mobile number या password गलत है.";

return;

}

if(disabled.includes(id)){

document.getElementById("error")
.innerText="Admin ने आपका account disable किया है.";

return;

}

currentUser=id;

openApp();

}


/* OPEN APP */

function openApp(){

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";

if(currentUser!=="ADMIN"){

document.getElementById("adminBtn").style.display="none";
document.getElementById("inviteBtn").style.display="none";

}

renderMessages();

}


/* LOGOUT */

function logout(){

location.reload();

}


/* CHAT */

function enterSend(e){

if(e.key==="Enter")sendMessage();

}

function sendMessage(){

const input=
document.getElementById("message");

const text=input.value.trim();

if(!text)return;

const name=
currentUser==="ADMIN"
?"Owner"
:MEMBERS[currentUser].name;

messages.push({
type:"text",
user:currentUser,
name:name,
text:text,
time:new Date().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})
});

saveMessages();

input.value="";

renderMessages();

}

function saveMessages(){

localStorage.setItem(
"SF_messages",
JSON.stringify(messages)
);

}


/* RENDER */

function renderMessages(){

const chat=
document.getElementById("chat");

chat.innerHTML="";

if(messages.length===0){

chat.innerHTML=`
<div class="msg">
<small>Secret Frame</small>
Welcome to your private group.
</div>`;

return;

}

messages.forEach(m=>{

const div=document.createElement("div");

div.className=
"msg "+(m.user===currentUser?"mine":"");

if(m.type==="text"){

div.innerHTML=`
<small>${safe(m.name)} • ${safe(m.time)}</small>
${safe(m.text)}
`;

}

if(m.type==="media"){

if(m.kind==="image"){

div.innerHTML=`
<small>${safe(m.name)}</small>
<img src="${m.data}">
`;

}else{

div.innerHTML=`
<small>${safe(m.name)}</small>
<video src="${m.data}" controls></video>
`;

}

}

chat.appendChild(div);

});

chat.scrollTop=chat.scrollHeight;

}


/* MEDIA */

function pickMedia(){

document.getElementById("media").click();

}

function sendMedia(event){

const file=event.target.files[0];

if(!file)return;

if(file.size>8*1024*1024){

alert("Demo में 8MB से बड़ी file नहीं भेज सकते.");

return;

}

const reader=new FileReader();

reader.onload=function(){

const name=
currentUser==="ADMIN"
?"Owner"
:MEMBERS[currentUser].name;

messages.push({
type:"media",
kind:file.type.startsWith("image/")
?"image":"video",
user:currentUser,
name:name,
data:reader.result
});

saveMessages();

renderMessages();

};

reader.readAsDataURL(file);

event.target.value="";

}


/* ADMIN */

function adminPanel(){

if(currentUser!=="ADMIN"){

alert("Only Admin can manage Secret Frame.");

return;

}

let html=`
<p style="color:#9daab3">
यहाँ से पूरा member access आपके control में है।
</p>
`;

Object.keys(MEMBERS).forEach(id=>{

const member=MEMBERS[id];

const off=disabled.includes(id);

html+=`
<div class="row">

<b>${member.name}</b>

<br>

<small>${id}</small>

<br><br>

<span style="color:${off?"#ff5555":"#00c853"}">
● ${off?"Disabled":"Active"}
</span>

<button
class="btn ${off?"green":"red"}"
style="float:right"
onclick="toggleMember('${id}')">

${off?"Enable":"Disable"}

</button>

</div>
`;

});

document.getElementById("modalTitle")
.innerText="Secret Frame Admin";

document.getElementById("modalContent")
.innerHTML=html;

document.getElementById("modal")
.classList.add("show");

}


/* ENABLE / DISABLE */

function toggleMember(id){

if(disabled.includes(id)){

disabled=disabled.filter(x=>x!==id);

}else{

disabled.push(id);

}

localStorage.setItem(
"SF_disabled",
JSON.stringify(disabled)
);

adminPanel();

}


/* INVITE */

function invite(){

if(currentUser!=="ADMIN")return;

const code=
"SF-"+Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

document.getElementById("modalTitle")
.innerText="Secret Frame Invite";

document.getElementById("modalContent")
.innerHTML=`

<p>Private invite code:</p>

<div style="
font-size:30px;
font-weight:bold;
text-align:center;
padding:20px;
background:#0b141a;
border-radius:12px;
letter-spacing:5px">

${code}

</div>

<button
class="btn green"
style="margin-top:10px"
onclick="copyCode('${code}')">

Copy Code

</button>
`;

document.getElementById("modal")
.classList.add("show");

}

function copyCode(code){

navigator.clipboard.writeText(code);

alert("Invite code copied.");

}


/* VIDEO */

async function videoCall(){

document.getElementById("modalTitle")
.innerText="Secret Frame Video Call";

document.getElementById("modalContent")
.innerHTML=`

<div class="video">

<div>
<small>You</small>
<video id="local" autoplay muted playsinline></video>
</div>

<div>
<small>Friend</small>
<video id="remote" autoplay playsinline></video>
</div>

</div>

<div style="margin-top:10px">

<button class="btn gray" onclick="toggleMic()">
🎙️ Mic
</button>

<button class="btn gray" onclick="toggleCamera()">
📷 Camera
</button>

<button class="btn red" onclick="endCall()">
End Call
</button>

</div>

<p style="color:#9daab3">
Camera preview चालू है। अलग-अलग phones के बीच
real video call के लिए WebRTC signaling/backend चाहिए।
</p>
`;

document.getElementById("modal")
.classList.add("show");

try{

window.stream=
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("local")
.srcObject=window.stream;

}catch(e){

alert("Camera/Mic permission नहीं मिली.");

}

}


/* VOICE */

async function voiceCall(){

try{

window.stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

document.getElementById("modalTitle")
.innerText="Secret Frame Voice Call";

document.getElementById("modalContent")
.innerHTML=`

<h2>📞 Voice Call</h2>

<p>Microphone active.</p>

<button
class="btn red"
onclick="endCall()">
End Call
</button>
`;

document.getElementById("modal")
.classList.add("show");

}catch(e){

alert("Microphone permission नहीं मिली.");

}

}


/* MIC */

function toggleMic(){

if(!window.stream)return;

const t=
window.stream.getAudioTracks()[0];

if(t)t.enabled=!t.enabled;

}


/* CAMERA */

function toggleCamera(){

if(!window.stream)return;

const t=
window.stream.getVideoTracks()[0];

if(t)t.enabled=!t.enabled;

}


/* END CALL */

function endCall(){

if(window.stream){

window.stream
.getTracks()
.forEach(t=>t.stop());

}

window.stream=null;

closeModal();

}


/* CLOSE */

function closeModal(){

document
.getElementById("modal")
.classList
.remove("show");

}


/* SAFE TEXT */

function safe(value){

const div=document.createElement("div");

div.textContent=value;

return div.innerHTML;

}

</script>

</body>
</html>
