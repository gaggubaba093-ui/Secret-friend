<!-- ================= FIREBASE ================= -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getDatabase,
ref,
push,
set,
onValue,
onChildAdded
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={

apiKey:
"AIzaSyB7B00ndag8PE78pjLxFg4iok9-9_U5bz0",

authDomain:
"secret-frame-698ba.firebaseapp.com",

databaseURL:
"https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"secret-frame-698ba",

storageBucket:
"secret-frame-698ba.firebasestorage.app",

messagingSenderId:
"601470862803",

appId:
"1:601470862803:web:3b666e06133804609b9b26"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* ================= USER ================= */

let me=
localStorage.getItem("sfPhone")||"";

let myName=
localStorage.getItem("sfName")||"";

let selected=null;

let messageListener=null;


/* ================= PHONE ================= */

function cleanPhone(value){

return String(value||"")
.replace(/\D/g,"")
.slice(-10);

}


/* ================= MEMBER PHONE ================= */

function getMemberPhone(member,key){

return cleanPhone(
member?.phone ||
key ||
""
);

}


/* ================= MEMBER NAME ================= */

function getMemberName(member,key){

return String(
member?.name ||
member?.displayName ||
("Member "+getMemberPhone(member,key))
).trim();

}


/* ================= FIND MEMBER ================= */

async function fetchMember(phone){

const wanted=cleanPhone(phone);

return new Promise(resolve=>{

onValue(

ref(db,"members"),

snapshot=>{

const data=snapshot.val()||{};

let found=null;


Object.entries(data).forEach(
([key,member])=>{

if(
!member ||
typeof member!=="object"
)return;


const memberPhone=
getMemberPhone(member,key);


if(memberPhone===wanted){

found={

...member,

phone:memberPhone,

name:
getMemberName(member,key)

};

}

});


resolve(found);

},

()=>resolve(null),

{
onlyOnce:true
}

);

});

}


/* ================= LOGIN ================= */

window.login=async function(){

const phone=
cleanPhone(
document.getElementById("loginId").value
);


const password=
document.getElementById("loginPassword").value.trim();


const error=
document.getElementById("error");


const button=
document.getElementById("loginButton");


error.textContent="";


if(phone.length!==10){

error.textContent=
"सही 10 अंकों का Mobile Number डालें।";

return;

}


if(!password){

error.textContent=
"Password डालें।";

return;

}


button.disabled=true;

button.textContent=
"Checking...";


try{

const member=
await fetchMember(phone);


if(!member){

error.textContent=
"यह Mobile Number registered नहीं है।";

return;

}


/*

अगर Firebase में password है
तो वही password चलेगा।

अगर password खाली है
तो mobile के आखिरी 4 अंक
password होंगे।

*/

const savedPassword=
String(
member.password||""
).trim();


const last4=
phone.slice(-4);


if(savedPassword){

if(savedPassword!==password){

error.textContent=
"Password गलत है।";

return;

}

}else{

if(password!==last4){

error.textContent=
"Password गलत है। आखिरी 4 अंक डालें।";

return;

}

}


me=member.phone;

myName=
getMemberName(
member,
member.phone
);


localStorage.setItem(
"sfPhone",
me
);


localStorage.setItem(
"sfName",
myName
);


openApp();


}catch(e){

console.error(e);

error.textContent=
"Firebase connection error।";

}finally{

button.disabled=false;

button.textContent=
"Login";

}

};


/* ================= OPEN APP ================= */

function openApp(){

document.getElementById("login")
.style.display="none";


document.getElementById("app")
.style.display="block";


loadMembers();

listenIncomingCalls();

}


/* ================= MEMBERS ================= */

function loadMembers(){

onValue(

ref(db,"members"),

snapshot=>{

const data=
snapshot.val()||{};

const box=
document.getElementById("people");


box.innerHTML="";


Object.entries(data).forEach(
([key,member])=>{

if(
!member ||
typeof member!=="object"
)return;


const phone=
getMemberPhone(
member,
key
);


if(!phone)return;


if(phone===me)return;


const name=
getMemberName(
member,
key
);


const row=
document.createElement("div");


row.className="person";


row.dataset.name=
name.toLowerCase();


row.innerHTML=`

<div class="avatar">
${name.substring(0,2).toUpperCase()}
</div>

<div class="info">

<div class="name"></div>

<div
class="status"
id="last-${safe(phone)}"
>
Start a private chat
</div>

</div>

`;


row.querySelector(".name")
.textContent=name;


row.onclick=()=>{

openChat({

...member,

phone:phone,

name:name

});

};


box.appendChild(row);


listenLastMessage({

phone:phone,

name:name

});

});

}

);

}


/* ================= LAST MESSAGE ================= */

function listenLastMessage(member){

const id=
chatId(
me,
member.phone
);


onValue(

ref(
db,
"privateChats/"+id+"/messages"
),

snapshot=>{

const data=
snapshot.val();


if(!data)return;


const arr=
Object.values(data);


if(!arr.length)return;


arr.sort(
(a,b)=>
(a.createdAt||0)-
(b.createdAt||0)
);


const last=
arr[arr.length-1];


const box=
document.getElementById(
"last-"+safe(member.phone)
);


if(box){

box.textContent=
last.sender===me
?
"You: "+last.text
:
last.text;

}

}

);

}


/* ================= CHAT ================= */

window.openChat=function(member){

selected=member;


document.getElementById(
"chatName"
).textContent=
member.name;


document.getElementById(
"chatAvatar"
).textContent=
member.name
.substring(0,2)
.toUpperCase();


document.getElementById(
"chat"
).style.display="flex";


loadMessages();

};


/* ================= CHAT ID ================= */

function chatId(a,b){

return [

cleanPhone(a),

cleanPhone(b)

]

.sort()

.join("_");

}


/* ================= MESSAGES ================= */

function loadMessages(){

const box=
document.getElementById(
"messages"
);


box.innerHTML="";


if(messageListener){

messageListener();

messageListener=null;

}


const id=
chatId(
me,
selected.phone
);


messageListener=

onChildAdded(

ref(
db,
"privateChats/"+id+"/messages"
),

snap=>{

const data=
snap.val();


if(!data)return;


const msg=
document.createElement("div");


msg.className=
"msg "+
(
data.sender===me
?
"mine"
:
""
);


msg.innerHTML=`

<div class="msgText"></div>

<div class="msgTime">
${time(data.createdAt)}
${data.sender===me?" ✓✓":""}
</div>

`;


msg.querySelector(
".msgText"
).textContent=
String(data.text||"");


box.appendChild(msg);


box.scrollTop=
box.scrollHeight;

}

);

}


/* ================= SEND ================= */

window.sendMessage=
async function(e){

e.preventDefault();


if(!selected)return;


const input=
document.getElementById(
"message"
);


const text=
input.value.trim();


if(!text)return;


const id=
chatId(
me,
selected.phone
);


await push(

ref(
db,
"privateChats/"+id+"/messages"
),

{

sender:me,

senderName:myName,

receiver:selected.phone,

text:text,

createdAt:Date.now()

}

);


input.value="";

};


/* ================= SEARCH ================= */

window.searchPeople=
function(){

const q=
document.getElementById(
"search"
).value
.toLowerCase();


document
.querySelectorAll(".person")
.forEach(row=>{

row.style.display=
row.dataset.name
.includes(q)
?
"flex"
:
"none";

});

};


/* ================= CLOSE CHAT ================= */

window.closeChat=
function(){

if(messageListener){

messageListener();

messageListener=null;

}


document.getElementById(
"chat"
).style.display="none";


selected=null;

};


/* ================= LOGOUT ================= */

window.logout=
function(){

localStorage.removeItem(
"sfPhone"
);

localStorage.removeItem(
"sfName"
);

location.reload();

};


/* ================= SAFE ================= */

function safe(x){

return cleanPhone(x);

}


/* ================= TIME ================= */

function time(t){

return new Date(
t||Date.now()
)
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =================================================
   WEBRTC CALL
================================================= */

let pc=null;

let stream=null;

let callId=null;

let callType="audio";

let incoming=null;


const rtcConfig={

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

};


/* ================= START CALL ================= */

window.startCall=
async function(type){

if(!selected){

alert(
"पहले दोस्त की chat खोलें।"
);

return;

}


callType=type;


callId=
"call_"+
Date.now()+
"_"+

Math.random()
.toString(36)
.slice(2);


try{

stream=
await navigator
.mediaDevices
.getUserMedia({

audio:true,

video:
type==="video"

});


showActive(
"Calling "+selected.name
);


pc=
new RTCPeerConnection(
rtcConfig
);


stream
.getTracks()
.forEach(
track=>
pc.addTrack(
track,
stream
)
);


pc.ontrack=e=>{

document.getElementById(
"remoteVideo"
).srcObject=
e.streams[0];

};


pc.onicecandidate=e=>{

if(!e.candidate)return;


set(

ref(
db,
"calls/"+
callId+
"/callerCandidates/"+
Date.now()
),

e.candidate.toJSON()

);

};


const offer=
await pc.createOffer();


await pc.setLocalDescription(
offer
);


await set(

ref(
db,
"calls/"+callId
),

{

caller:me,

callerName:myName,

callee:selected.phone,

calleeName:selected.name,

type:type,

status:"ringing",

offer:{

type:offer.type,

sdp:offer.sdp

},

createdAt:Date.now()

}

);


onValue(

ref(
db,
"calls/"+callId+"/answer"
),

async snap=>{

const answer=
snap.val();


if(

answer&&
pc&&
!pc.currentRemoteDescription

){

await pc
.setRemoteDescription(

new RTCSessionDescription(
answer
)

);


showActive(
"Connected"
);

}

}

);


onChildAdded(

ref(
db,
"calls/"+callId+
"/calleeCandidates"
),

async snap=>{

if(!pc)return;


try{

await pc.addIceCandidate(

new RTCIceCandidate(
snap.val()
)

);

}catch(e){}

}

);


}catch(e){

alert(
"Camera/Microphone permission Allow करें.\n\n"+
e.message
);


cleanup();

}

};


/* ================= INCOMING ================= */

function listenIncomingCalls(){

onValue(

ref(db,"calls"),

snapshot=>{

const calls=
snapshot.val()||{};


for(
const id in calls
){

const c=
calls[id];


if(

c &&
c.callee===me &&
c.status==="ringing" &&
!callId

){

incoming={

id:id,

data:c

};


callId=id;

callType=c.type;


document.getElementById(
"call"
).style.display="flex";


document.getElementById(
"incoming"
).style.display="block";


document.getElementById(
"activeCall"
).style.display="none";


document.getElementById(
"callTitle"
).textContent=
"Incoming Call";


document.getElementById(
"incomingName"
).textContent=
c.callerName||
"Friend";


document.getElementById(
"incomingType"
).textContent=
c.type==="video"
?
"📹 Video Call"
:
"📞 Voice Call";


break;

}

}

}

);

}


/* ================= ACCEPT ================= */

window.acceptCall=
async function(){

if(!incoming)return;


const c=
incoming.data;


try{

stream=
await navigator
.mediaDevices
.getUserMedia({

audio:true,

video:
c.type==="video"

});


pc=
new RTCPeerConnection(
rtcConfig
);


stream
.getTracks()
.forEach(
track=>
pc.addTrack(
track,
stream
)
);


pc.ontrack=e=>{

document.getElementById(
"remoteVideo"
).srcObject=
e.streams[0];

};


pc.onicecandidate=e=>{

if(!e.candidate)return;


set(

ref(
db,
"calls/"+callId+
"/calleeCandidates/"+
Date.now()
),

e.candidate.toJSON()

);

};


await pc.setRemoteDescription(

new RTCSessionDescription(
c.offer
)

);


const answer=
await pc.createAnswer();


await pc.setLocalDescription(
answer
);


await set(

ref(
db,
"calls/"+callId+"/answer"
),

{

type:answer.type,

sdp:answer.sdp

}

);


await set(

ref(
db,
"calls/"+callId+"/status"
),

"connected"

);


showActive(
"Connected"
);


onChildAdded(

ref(
db,
"calls/"+callId+
"/callerCandidates"
),

async snap=>{

try{

await pc.addIceCandidate(

new RTCIceCandidate(
snap.val()
)

);

}catch(e){}

}

);


}catch(e){

alert(
"Call accept नहीं हुई:\n"+
e.message
);


cleanup();

}

};


/* ================= REJECT ================= */

window.rejectCall=
async function(){

if(callId){

await set(

ref(
db,
"calls/"+callId+
"/status"
),

"rejected"

);

}


cleanup();

};


/* ================= CALL UI ================= */

function showActive(title){

document.getElementById(
"call"
).style.display="flex";


document.getElementById(
"incoming"
).style.display="none";


document.getElementById(
"activeCall"
).style.display="block";


document.getElementById(
"callTitle"
).textContent=
"📞 "+title;


document.getElementById(
"localVideo"
).srcObject=
stream;


if(callType==="audio"){

document.getElementById(
"localVideo"
).style.display="none";


document.getElementById(
"remoteVideo"
).style.display="none";

}else{

document.getElementById(
"localVideo"
).style.display="block";


document.getElementById(
"remoteVideo"
).style.display="block";

}

}


/* ================= MIC ================= */

window.toggleMic=
function(){

if(!stream)return;


const track=
stream.getAudioTracks()[0];


if(track){

track.enabled=
!track.enabled;

}

};


/* ================= CAMERA ================= */

window.toggleCamera=
function(){

if(!stream)return;


const track=
stream.getVideoTracks()[0];


if(track){

track.enabled=
!track.enabled;

}

};


/* ================= END CALL ================= */

window.endCall=
async function(){

if(callId){

try{

await set(

ref(
db,
"calls/"+callId+
"/status"
),

"ended"

);

}catch(e){}

}


cleanup();

};


/* ================= CLEANUP ================= */

function cleanup(){

if(stream){

stream
.getTracks()
.forEach(
track=>track.stop()
);

stream=null;

}


if(pc){

pc.close();

pc=null;

}


document.getElementById(
"localVideo"
).srcObject=null;


document.getElementById(
"remoteVideo"
).srcObject=null;


document.getElementById(
"call"
).style.display="none";


document.getElementById(
"incoming"
).style.display="none";


document.getElementById(
"activeCall"
).style.display="none";


incoming=null;

callId=null;

}


/* ================= AUTO LOGIN ================= */

if(me){

openApp();

}

</script>

</body>
</html>
