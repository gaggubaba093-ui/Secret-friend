<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
set,
remove,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


/* ==================================================
   FIREBASE CONFIG
   Your database URL is already included.
   ================================================== */

const firebaseConfig={

projectId:"secret-frame-698ba",

databaseURL:
"https://secret-frame-698ba-default-rtdb.asia-southeast1.firebasedatabase.app"

};


/* INITIALIZE */

const firebaseApp=
initializeApp(firebaseConfig);

const db=
getDatabase(firebaseApp);


/* ==================================================
   SECRET FRAME MEMBERS
   ================================================== */

const ADMIN={
id:"ADMIN",
password:"admin123",
name:"Owner / Admin"
};

const MEMBERS={

"7209000233":{
name:"Friend 1",
password:"1111"
},

"+917337753903":{
name:"Friend 2",
password:"2222"
},

"+919771094346":{
name:"Friend 3",
password:"3333"
}

};


let currentUser=null;

let messagesRef=null;


/* ==================================================
   ELEMENTS
   ================================================== */

const loginPage=
document.getElementById("login");

const appPage=
document.getElementById("app");

const errorBox=
document.getElementById("error");

const chat=
document.getElementById("chat");

const messageInput=
document.getElementById("message");


/* ==================================================
   LOGIN
   ================================================== */

document
.getElementById("loginButton")
.addEventListener(
"click",
login
);

document
.getElementById("loginPassword")
.addEventListener(
"keydown",
e=>{
if(e.key==="Enter")login();
}
);


function login(){

const id=
document
.getElementById("loginId")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;


if(
id===ADMIN.id &&
password===ADMIN.password
){

currentUser="ADMIN";

openApp();

return;

}


if(
!MEMBERS[id] ||
MEMBERS[id].password!==password
){

errorBox.textContent=
"Mobile number या password गलत है.";

return;

}


currentUser=id;

openApp();

}


/* ==================================================
   OPEN APP
   ================================================== */

function openApp(){

loginPage.style.display="none";

appPage.style.display="block";


if(currentUser!=="ADMIN"){

document
.getElementById("adminBtn")
.style.display="none";

}


startRealtimeChat();

}


/* ==================================================
   REALTIME CHAT
   ================================================== */

function startRealtimeChat(){

messagesRef=
ref(db,"secretFrame/messages");


onValue(
messagesRef,
snapshot=>{

const data=
snapshot.val() || {};

const list=
Object.entries(data)
.map(
([id,value])=>({
id,
...value
})
)
.sort(
(a,b)=>
(a.createdAt||0)-
(b.createdAt||0)
);

renderMessages(list);

},
error=>{

console.error(error);

chat.innerHTML=`

<div style="
padding:20px;
color:#ff6978;
">

Firebase connection error:<br>

${escapeHTML(error.message)}

</div>

`;

}

);

}


/* ==================================================
   SEND MESSAGE
   ================================================== */

document
.getElementById("sendBtn")
.addEventListener(
"click",
sendMessage
);

messageInput
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){
sendMessage();
}

}
);


async function sendMessage(){

const text=
messageInput
.value
.trim();

if(!text)return;

const name=
currentUser==="ADMIN"
?ADMIN.name
:MEMBERS[currentUser].name;


try{

await push(
messagesRef,
{

type:"text",

uid:currentUser,

name:name,

text:text,

createdAt:Date.now()

}
);

messageInput.value="";

}
catch(error){

alert(
"Message send नहीं हुआ: "+
error.message
);

}

}


/* ==================================================
   RENDER MESSAGES
   ================================================== */

function renderMessages(list){

chat.innerHTML=`

<div class="day">
<span>Secret Frame • Live Chat</span>
</div>

`;


if(list.length===0){

chat.innerHTML+=`

<div class="message">

<div class="avatar">
SF
</div>

<div class="bubble">

<div class="sender">
Secret Frame
</div>

Welcome! पहला message भेजो. 🔥

</div>

</div>

`;

return;

}


list.forEach(m=>{

const wrapper=
document.createElement("div");

wrapper.className=
"message "+
(
m.uid===currentUser
?"mine"
:""
);


const avatar=
m.uid===currentUser
?""
:`
<div class="avatar">
${initials(m.name)}
</div>
`;


let content="";


if(m.type==="text"){

content=
escapeHTML(m.text);

}


if(m.type==="image"){

content=`

<img
class="media"
src="${m.data}"
alt="Shared image"
>

`;

}


if(m.type==="video"){

content=`

<video
class="media"
src="${m.data}"
controls>
</video>

`;

}


wrapper.innerHTML=`

${avatar}

<div class="bubble">

<div class="sender">
${escapeHTML(m.name)}
${m.uid==="ADMIN"?" 👑":""}
</div>

${content}

<div class="time">
${formatTime(m.createdAt)}
</div>

</div>

`;

chat.appendChild(wrapper);

});


chat.scrollTop=
chat.scrollHeight;

}


/* ==================================================
   MEDIA
   ================================================== */

document
.getElementById("mediaBtn2")
.addEventListener(
"click",
()=>{
document
.getElementById("mediaInput")
.click();
}
);


document
.getElementById("mediaInput")
.addEventListener(
"change",
sendMedia
);


async function sendMedia(event){

const file=
event.target.files[0];

if(!file)return;


if(file.size>5*1024*1024){

alert(
"अभी testing के लिए 5MB से छोटी photo/video चुनो."
);

event.target.value="";

return;

}


const reader=
new FileReader();


reader.onload=async()=>{

const name=
currentUser==="ADMIN"
?ADMIN.name
:MEMBERS[currentUser].name;


try{

await push(
messagesRef,
{

type:
file.type.startsWith("image/")
?"image"
:"video",

uid:currentUser,

name:name,

data:reader.result,

createdAt:Date.now()

}
);

}
catch(error){

alert(
"Media send नहीं हुआ: "+
error.message
);

}

};


reader.readAsDataURL(file);

event.target.value="";

}

Object.entries(MEMBERS)

background:#d6384c;

</button>

</div>

`;

}
);


document
.getElementById("modalContent")
.innerHTML=html;


document
.getElementById("modal")
.classList
.add("show");

}

document

document

"Secret Frame Members";


document
.getElementById("modalContent")
.innerHTML=`

<p>🟢 7209000233</p>

<p>🟢 +917337753903</p>

<p>🟢 +919771094346</p>

`;

document
.getElementById("modal")
.classList

document

startVoice

document

/* ==================================================

document

"click",
startVideo
);

document
.getElementById("videoTop")
.addEventListener(
"click",
startVideo

async function startVideo(){

document
.getElementById("modalTitle")
.textContent=
"Secret Frame • Video Call";


document
.getElementById("modalContent")
.innerHTML=`

<div class="videoGrid">

<div>

<p>You</p>

<video
id="localVideo"
autoplay
muted
playsinline>
</video>

</div>

<div>

<br>

<button
id="micBtn"

<button

<button
id="stopVideo"

`;


document

try{

await navigator

.getUserMedia({

audio:true

});


document
.getElementById("localVideo")
.srcObject=
window.callStream;


}
catch(error){

}

/* ==================================================
   MIC / CAMERA
   ================================================== */

function toggleMic(){

if(!window.callStream)return;

const track=
window.callStream
.getAudioTracks()[0];

if(track){

track.enabled=
!track.enabled;

}

}


function toggleCamera(){

if(!window.callStream)return;

const track=
window.callStream
.getVideoTracks()[0];

if(track){

track.enabled=
!track.enabled;

}

}


function stopCall(){

if(window.callStream){

window.callStream
.getTracks()
.forEach(
track=>track.stop()
);

}

window.callStream=null;

closeModal();

}

/* ==================================================
   HELPERS
   ================================================== */

function initials(name){

return String(name||"SF")
.split(" ")
.map(x=>x[0])
.join("")
.substring(0,2)
.toUpperCase();

}


function formatTime(time){

if(!time)return"";

return new Date(time)
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


function escapeHTML(value){

const div=
document.createElement("div");

div.textContent=
String(value??"");

return div.innerHTML;

}
